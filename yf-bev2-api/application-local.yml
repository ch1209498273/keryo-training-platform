server:
  port: 8080

spring:
  application:
    name: yf-boot-api
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    deserialization:
      fail_on_unknown_properties: false
      accept-empty-string-as-null-object: true
    parser:
      allow_unquoted_control_chars: true
      allow_single_quotes: true
    serialization:
      fail-on-empty-beans: false
    mapper:
      allow-coercion-of-scalars: true

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:exam_keryo}?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 50
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      pool-name: YfBeHikariCP

  # 本地无Redis，填充假值避免 @Value 报错
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000

